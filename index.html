<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Because of You - 視覺小說</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Microsoft JhengHei', Arial, sans-serif;
            background-color: #000;
            color: #fff;
            /* 防止整個網頁滾動，鎖定在當前螢幕大小 */
            overflow: hidden; 
            height: 100vh;
            height: 100dvh; /* 適應手機瀏覽器的動態高度 */
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }
        /* 遊戲主框架：填滿螢幕或最大 800px */
        #game-container {
            width: 100%;
            max-width: 800px;
            height: 100%;
            max-height: 900px;
            background-color: #111;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }
        /* 上半部：圖片區 (彈性高度，自適應剩餘空間) */
        #image-container {
            width: 100%;
            flex: 1 1 auto; /* 自動伸展佔滿空間 */
            min-height: 40%; /* 確保圖片至少有一定高度 */
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            color: #aaa;
            transition: background-color 0.5s;
            border-bottom: 2px solid #444;
        }
        #image-placeholder {
            display: none; 
        }
        /* 下半部：UI互動區 (固定最大高度，確保選項完整顯示) */
        #ui-container {
            width: 100%;
            flex: 0 0 auto;
            padding: 15px 20px 25px 20px;
            box-sizing: border-box;
            background: linear-gradient(180deg, #1a1a1a 0%, #0a0a0a 100%);
            position: relative;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }
        #character-name {
            font-weight: bold;
            font-size: 1.15rem;
            color: #4da6ff;
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px #000;
        }
        #dialogue-text {
            font-size: 1.1rem;
            line-height: 1.5;
            color: #fff;
        }
        .english-text {
            color: #b3b3b3;
            font-size: 0.9rem;
            margin-top: 4px;
            font-style: italic;
        }
        /* 點擊繼續的閃爍箭頭 */
        #click-indicator {
            position: absolute;
            bottom: 10px;
            right: 20px;
            font-size: 1.2rem;
            color: #4da6ff;
            animation: blink 1s infinite;
            display: none;
        }
        @keyframes blink {
            50% { opacity: 0.3; }
        }
        /* 選項區域 (微調間距，確保在一頁內顯示完畢) */
        #options-container {
            display: none;
            flex-direction: column;
            gap: 8px; /* 縮小間距 */
            margin-top: 15px;
            width: 100%;
        }
        .option-btn {
            background: rgba(30, 30, 30, 0.8);
            border: 1px solid #4da6ff;
            color: #fff;
            padding: 10px 15px; /* 縮小內邊距 */
            font-size: 1rem; /* 微調字體 */
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            line-height: 1.3;
        }
        .option-btn:hover {
            background: rgba(77, 166, 255, 0.2);
            border-color: #79c2ff;
            transform: translateX(5px);
        }
        /* 結局操作按鈕 */
        #action-btn-container {
            display: none;
            margin-top: 15px;
            text-align: center;
        }
        .action-btn {
            background-color: #e74c3c;
            border: 2px solid #c0392b;
            color: #fff;
            padding: 10px 30px;
            font-size: 1.1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            transition: all 0.2s;
        }
        .action-btn:hover {
            transform: scale(1.05);
        }
        .action-btn.pass {
            background-color: #2ecc71;
            border-color: #27ae60;
        }
        .action-btn.true-ending-btn {
            background-color: #f1c40f;
            border-color: #f39c12;
            color: #000;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="image-container">
        <span id="image-placeholder">載入中...</span>
    </div>
    
    <div id="ui-container" onclick="advanceState()">
        <div id="character-name"></div>
        <div id="dialogue-text"></div>
        <div id="click-indicator">▼</div>
        
        <div id="options-container"></div>
        
        <div id="action-btn-container">
            <button id="action-btn" class="action-btn">下一步</button>
        </div>
    </div>
</div>

<script>
    const gameData = [
        {
            level: 1,
            sceneImageId: "IMG_01_SCENE_PANTRY",
            sceneZh: "辦公室茶水間。你和黎恩平時只是點頭之交的同事。",
            sceneEn: "Office pantry. You and Rien are just casual acquaintances at work.",
            dialogue: "You didn't eat lunch because you were too busy?",
            options: [
                { text: "I skipped lunch because I wanted you to bring me something!", result: "Fail", endingImageId: "IMG_01_END_FAIL_A", endingZh: "黎恩覺得你太有控制慾，默默拉開距離。", endingEn: "Rien feels you are too controlling and quietly distances himself." },
                { text: "I didn't eat lunch because I had a lot of work.", result: "Fail", endingImageId: "IMG_01_END_FAIL_B", endingZh: "黎恩只回了句「那辛苦了」，毫無火花。", endingEn: "Rien simply replies, 'That's tough,' with zero sparks." },
                { text: "I just grabbed a sandwich because I want to eat dinner with you.", result: "Pass", endingImageId: "IMG_01_END_PASS", endingZh: "黎恩愣了一下，隨後笑著答應了。成功開啟了你們的私下交集！", endingEn: "Rien pauses for a second, then smiles and agrees. You've successfully started interacting outside of work!" }
            ]
        },
        {
            level: 2,
            sceneImageId: "IMG_02_SCENE_NIGHT",
            sceneZh: "深夜的辦公室只剩你們兩人，剛忙完一個大專案。",
            sceneEn: "It's late at night, and you two are the only ones left in the office after finishing a major project.",
            dialogue: "There's no train now because it's too late. Do you want to come to my home?",
            options: [
                { text: "I will go to your home because I want to sleep in your bed.", result: "Fail", endingImageId: "IMG_02_END_FAIL_A", endingZh: "黎恩覺得你進展太快了，嚇得趕緊幫你叫了一輛 Uber 塞你上車。", endingEn: "Rien thinks you're moving too fast, gets scared, and quickly puts you in an Uber." },
                { text: "I will take a taxi because I don't want to bother you.", result: "Fail", endingImageId: "IMG_02_END_FAIL_B", endingZh: "黎恩覺得你很有禮貌，但也真的只是同事。", endingEn: "Rien thinks you are very polite, but truly just a colleague." },
                { text: "I will go to your home because I want to see you outside the office.", result: "Pass", endingImageId: "IMG_02_END_PASS", endingZh: "黎恩輕笑了一聲：「那我的私下生活可能會讓你驚訝喔。」兩人一起走入夜色中。", endingEn: "Rien chuckles softly, 'My private life might surprise you then.' You both walk into the night." }
            ]
        },
        {
            level: 3,
            sceneImageId: "IMG_03_SCENE_RAIN",
            sceneZh: "下班遇到滂沱大雨，你們被迫靠得很近。",
            sceneEn: "You encounter heavy rain after work and are forced to stand very close to each other.",
            dialogue: "We need to share this small umbrella because it is raining heavily.",
            options: [
                { text: "I will hold you tightly because I don't want you to get wet.", result: "Fail", endingImageId: "IMG_03_END_FAIL_A", endingZh: "在大街上突然被緊抱，黎恩覺得你太過火了，不自在地推開你。", endingEn: "Suddenly hugged tightly on the street, Rien thinks you've crossed the line and pushes you away." },
                { text: "I will just run in the rain because the umbrella is too small.", result: "Fail", endingImageId: "IMG_03_END_FAIL_B", endingZh: "你淋成落湯雞，黎恩覺得你實在很不懂情調。", endingEn: "You get soaked, and Rien thinks you completely lack romance." },
                { text: "I don't mind the small umbrella because I like walking close to you.", result: "Pass", endingImageId: "IMG_03_END_PASS", endingZh: "雨聲中，黎恩的耳朵微微紅了。他默默把傘往你這邊傾斜了一點，兩人的肩膀輕輕摩擦著。", endingEn: "Amidst the rain, Rien's ears turn slightly red. He quietly tilts the umbrella towards you." }
            ]
        },
        {
            level: 4,
            sceneImageId: "IMG_04_SCENE_GYM",
            sceneZh: "逐漸熟絡後，話題開始帶有微小的性別張力。",
            sceneEn: "As you become more familiar, the conversation starts to carry a subtle tension.",
            dialogue: "I go to the gym after work every day because I want to stay fit.",
            options: [
                { text: "I will go with you because I want to see your muscles.", result: "Fail", endingImageId: "IMG_04_END_FAIL_A", endingZh: "黎恩覺得你只是在物化他的身材，尷尬地笑笑說「那你可能會失望」。", endingEn: "Rien feels you are objectifying his body, laughs awkwardly, and says 'You might be disappointed'." },
                { text: "I won't go because working out is too tiring.", result: "Fail", endingImageId: "IMG_04_END_FAIL_B", endingZh: "黎恩覺得你們的生活步調不合，默默轉移話題。", endingEn: "Rien feels your lifestyles are incompatible and quietly changes the subject." },
                { text: "I will join you because I need a handsome coach.", result: "Pass", endingImageId: "IMG_04_END_PASS", endingZh: "黎恩轉過頭去掩飾上揚的嘴角，心跳漏了一拍。他低聲說：「那你要做好心理準備，我很嚴格的喔。」", endingEn: "Rien turns away to hide a smirk, skipping a heartbeat. He whispers, 'You better be prepared; I'm strict.'" }
            ]
        },
        {
            level: 5,
            sceneImageId: "IMG_05_SCENE_TIE",
            sceneZh: "某次重要會議前，他在座位上顯得有些手忙腳亂，你們的距離近到能聽見彼此的呼吸。",
            sceneEn: "Before an important meeting, he looks a bit flustered. You are close enough to hear each other's breathing.",
            dialogue: "I need your help because I can't tie this tie properly today.",
            options: [
                { text: "I will tie it for you because you always look good in suits.", result: "Pass", endingImageId: "IMG_05_END_PASS", endingZh: "你靠近他幫他整理領帶，手指不經意擦過他的喉結。他垂下眼眸看著你專注的神情，呼吸變得有些急促。", endingEn: "You lean in to adjust his tie, fingers brushing his Adam's apple. He looks at you, his breathing ragged." },
                { text: "I will untie it because you look sexier without it.", result: "Fail", endingImageId: "IMG_05_END_FAIL_A", endingZh: "黎恩覺得你把重要的客戶會議當兒戲，皺起眉頭自己把領帶搶回去。", endingEn: "Rien thinks you're treating the meeting like a joke, frowns, and snatches the tie back." },
                { text: "You should watch a video because I don't know how to do it either.", result: "Fail", endingImageId: "IMG_05_END_FAIL_B", endingZh: "黎恩默默拿出手機查教學，氣氛瞬間降溫。", endingEn: "Rien silently takes out his phone to look up a tutorial. The romantic atmosphere freezes." }
            ]
        },
        {
            level: 6,
            sceneImageId: "IMG_06_SCENE_HOTEL",
            sceneZh: "到達外地飯店，打開房門卻發現公司訂錯了，只有一張大床。",
            sceneEn: "Arriving at the hotel, you open the door to find the company made a mistake—there is only one large bed.",
            dialogue: "We have to share this room because the company made a mistake.",
            options: [
                { text: "We can take a bath together because we are sharing a room.", result: "Fail", endingImageId: "IMG_06_END_FAIL_A", endingZh: "黎恩立刻打電話給櫃檯要求加床或換房，徹底把你當成變態。", endingEn: "Rien immediately calls the front desk for a room change, treating you like a pervert." },
                { text: "I will sleep on the floor because I don't want to bother you.", result: "Fail", endingImageId: "IMG_06_END_FAIL_B", endingZh: "黎恩覺得你把他當成外人，兩人整晚氣氛僵硬，毫無進展。", endingEn: "Rien feels you are treating him like a stranger. The atmosphere is stiff all night." },
                { text: "I hope you don't mind because I tend to hug things when I sleep.", result: "Pass", endingImageId: "IMG_06_END_PASS", endingZh: "黎恩的臉瞬間漲紅，他結巴地說：「我...我盡量不把你推開。」夜晚的房間裡充滿了危險又迷人的心跳聲。", endingEn: "Rien's face flushes red. He stammers, 'I... I'll try not to push you away.' The room is filled with heartbeats." }
            ]
        },
        {
            level: 7,
            sceneImageId: "IMG_07_SCENE_WINE",
            sceneZh: "專案順利結束的聚餐，他喝了點酒，眼神迷離地看著你。",
            sceneEn: "At the celebration dinner, he has had a little wine and looks at you with hazy eyes.",
            dialogue: "My face is red because I drank a little bit of wine.",
            options: [
                { text: "I will take you to a hotel because you are drunk.", result: "Fail", endingImageId: "IMG_07_END_FAIL_A", endingZh: "黎恩瞬間酒醒，覺得你想趁機佔便宜，立刻叫車回家。", endingEn: "Rien sobers up instantly, thinking you want to take advantage, and immediately goes home." },
                { text: "You should drink more water because it helps with the hangover.", result: "Fail", endingImageId: "IMG_07_END_FAIL_B", endingZh: "黎恩接過你的溫水，覺得你是個「很棒的兄弟」，戀愛線中斷。", endingEn: "Rien takes the water, thinking you are a 'great bro.' The romance line ends here." },
                { text: "Your face is red because you are looking at me.", result: "Pass", endingImageId: "IMG_07_END_PASS", endingZh: "黎恩先是愣住，隨後徹底投降。他輕輕抓住你的手腕，低聲說：「...被你發現了。那...你要負責嗎？」", endingEn: "Rien freezes, then completely surrenders. He grabs your wrist and whispers, '...You caught me. Are you going to take responsibility?'" }
            ]
        }
    ];

    let currentLevelIndex = 0;
    let gameState = "scene_intro"; 

    const imagePlaceholder = document.getElementById("image-placeholder");
    const characterName = document.getElementById("character-name");
    const dialogueText = document.getElementById("dialogue-text");
    const clickIndicator = document.getElementById("click-indicator");
    const optionsContainer = document.getElementById("options-container");
    const uiContainer = document.getElementById("ui-container");
    const actionBtnContainer = document.getElementById("action-btn-container");
    const actionBtn = document.getElementById("action-btn");
    const imgContainer = document.getElementById("image-container");

    function loadLevel(index) {
        gameState = "scene_intro";
        const levelData = gameData[index];
        
        imgContainer.style.backgroundImage = `url('./${levelData.sceneImageId}.png')`;
        imgContainer.style.backgroundSize = "cover";
        imgContainer.style.backgroundPosition = "center";
        imgContainer.style.backgroundRepeat = "no-repeat";
        
        characterName.innerText = "【 系統場景提示 】";
        dialogueText.innerHTML = `${levelData.sceneZh}<div class="english-text">${levelData.sceneEn}</div>`;
        
        optionsContainer.style.display = "none";
        actionBtnContainer.style.display = "none";
        clickIndicator.style.display = "block";
        uiContainer.style.cursor = "pointer";
    }

    function advanceState() {
        if (gameState === "scene_intro") {
            const levelData = gameData[currentLevelIndex];
            gameState = "question";
            
            characterName.innerText = "黎恩 (Rien)";
            dialogueText.innerHTML = levelData.dialogue; 
            clickIndicator.style.display = "none";
            uiContainer.style.cursor = "default";
            
            optionsContainer.innerHTML = "";
            levelData.options.forEach((opt) => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = opt.text;
                btn.onclick = (e) => {
                    e.stopPropagation(); 
                    selectOption(opt);
                };
                optionsContainer.appendChild(btn);
            });
            optionsContainer.style.display = "flex";
        }
    }

    function selectOption(option) {
        gameState = "ending";
        optionsContainer.style.display = "none"; 
        
        imgContainer.style.backgroundImage = `url('./${option.endingImageId}.png')`;
        
        characterName.innerText = (option.result === "Pass") ? "【 心動瞬間 】" : "【 氣氛凝結 】";
        dialogueText.innerHTML = `${option.endingZh}<div class="english-text">${option.endingEn}</div>`;

        actionBtnContainer.style.display = "block";
        
        // 移除先前的綁定，防止重複觸發
        actionBtn.onclick = null; 

        if (option.result === "Pass") {
            if (currentLevelIndex === gameData.length - 1) {
                // 第七關成功，進入隱藏勝利結局按鈕
                actionBtn.innerText = "進入最終結局 (True Ending)";
                actionBtn.className = "action-btn true-ending-btn";
                actionBtn.onclick = (e) => {
                    e.stopPropagation();
                    showTrueEnding();
                };
            } else {
                actionBtn.innerText = "進入下一關 (Next Level)";
                actionBtn.className = "action-btn pass";
                actionBtn.onclick = (e) => {
                    e.stopPropagation();
                    currentLevelIndex++;
                    loadLevel(currentLevelIndex);
                };
            }
        } else {
            actionBtn.innerText = "重新開始 (Restart)";
            actionBtn.className = "action-btn";
            actionBtn.onclick = (e) => {
                e.stopPropagation();
                currentLevelIndex = 0;
                loadLevel(currentLevelIndex);
            };
        }
    }

    // 觸發最終勝利畫面 (隱藏的第八個頁面)
    function showTrueEnding() {
        gameState = "true_ending";
        
        // 載入勝利接吻圖
        imgContainer.style.backgroundImage = `url('./IMG_08_TRUE_ENDING_KISS.jpg')`;
        
        characterName.innerText = "【 完美通關 True Ending 】";
        dialogueText.innerHTML = `黎恩緊緊抱住你，深深地吻了上來。所有的曖昧都在此刻化為真實的愛意。恭喜你，成功捕獲黎恩的心！<div class="english-text">Rien hugs you tightly and kisses you deeply. All the ambiguity turns into true love. Congratulations, you've captured Rien's heart!</div>`;
        
        // 隱藏選項，只留重玩按鈕
        optionsContainer.style.display = "none";
        clickIndicator.style.display = "none";
        uiContainer.style.cursor = "default";
        
        actionBtnContainer.style.display = "block";
        actionBtn.innerText = "重新回味 (Play Again)";
        actionBtn.className = "action-btn pass";
        actionBtn.onclick = (e) => {
            e.stopPropagation();
            currentLevelIndex = 0; // 重置遊戲
            loadLevel(currentLevelIndex);
        };
    }

    // 遊戲初始化
    loadLevel(currentLevelIndex);
</script>

</body>
</html>
