<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Because of You - 視覺小說</title>
    <style>
        /* 基礎設定 (通用) */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Microsoft JhengHei', Arial, sans-serif;
            background-color: #000;
            color: #fff;
            overflow: hidden; /* 防止整個網頁滾動 */
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        #game-container {
            width: 100%;
            height: 100%;
            background-color: #111;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            transition: all 0.3s ease;
        }

        #image-container {
            width: 100%;
            background-color: #000; /* 純黑底色，完美融合邊界 */
            display: flex;
            justify-content: center;
            align-items: center;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 0.3s ease-in-out;
            border-bottom: 2px solid #333;
        }

        #image-placeholder {
            display: none; 
        }

        #ui-container {
            width: 100%;
            flex: 0 0 auto;
            box-sizing: border-box;
            background: linear-gradient(180deg, #1a1a1a 0%, #0a0a0a 100%);
            position: relative;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        #character-name {
            font-weight: bold;
            font-size: 1.15rem;
            color: #4da6ff;
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px #000;
        }

        #dialogue-text {
            font-size: 1.1rem;
            line-height: 1.5;
            color: #fff;
        }

        .english-text {
            color: #b3b3b3;
            font-size: 0.9rem;
            margin-top: 4px;
            font-style: italic;
        }

        #click-indicator {
            position: absolute;
            bottom: 10px;
            right: 20px;
            font-size: 1.2rem;
            color: #4da6ff;
            animation: blink 1s infinite;
            display: none;
        }

        @keyframes blink {
            50% { opacity: 0.3; }
        }

        #options-container {
            display: none;
            flex-direction: column;
            gap: 8px;
            margin-top: 15px;
            width: 100%;
        }

        .option-btn {
            background: rgba(30, 30, 30, 0.8);
            border: 1px solid #4da6ff;
            color: #fff;
            padding: 10px 15px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            line-height: 1.3;
        }

        .option-btn:hover {
            background: rgba(77, 166, 255, 0.2);
            border-color: #79c2ff;
            transform: translateX(5px);
        }

        #action-btn-container {
            display: none;
            margin-top: 15px;
            text-align: center;
        }

        .action-btn {
            background-color: #e74c3c;
            border: 2px solid #c0392b;
            color: #fff;
            padding: 10px 30px;
            font-size: 1.1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            transition: all 0.2s;
        }

        .action-btn:hover {
            transform: scale(1.05);
        }

        .action-btn.pass {
            background-color: #2ecc71;
            border-color: #27ae60;
        }

        .action-btn.true-ending-btn {
            background-color: #f1c40f;
            border-color: #f39c12;
            color: #000;
        }

        /* ------------------------------------------- */
        /* ✨ 響應式設計 (RWD) 核心設定區 ✨ */
        /* ------------------------------------------- */

        /* 💻 電腦版 (寬螢幕)：最大化顯示 16:9 全圖，不裁切 */
        @media (min-width: 768px) {
            #game-container {
                max-width: 1200px; /* 電腦版畫面放寬，更有PC遊戲感 */
                max-height: 90vh; /* 避免頂到上下螢幕邊緣 */
                border-radius: 12px; /* 加上圓角更美觀 */
                overflow: hidden;
            }
            #image-container {
                flex: 1 1 65%; /* 讓圖片區塊佔據較多空間 */
                background-size: contain; /* 保證全圖完整顯示，不卡掉 */
            }
            #ui-container {
                padding: 25px 40px 30px 40px; /* 電腦版UI內邊距加大 */
            }
            .option-btn {
                padding: 12px 20px; /* 按鈕稍微加大 */
                font-size: 1.05rem;
            }
        }

        /* 📱 手機版 (直立螢幕)：裁切圖片填滿上半部，UI 固定在下方 */
        @media (max-width: 767px) {
            #game-container {
                max-width: 100%;
                max-height: 100%;
                border-radius: 0;
            }
            #image-container {
                flex: 1 1 auto;
                min-height: 40%;
                background-size: cover; /* 手機版裁切填滿 */
                background-position: center top; /* 裁切時優先保留上方人物頭部 */
            }
            #ui-container {
                padding: 15px 20px 25px 20px;
            }
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="image-container">
        <span id="image-placeholder">載入中...</span>
    </div>
    
    <div id="ui-container" onclick="advanceState()">
        <div id="character-name"></div>
        <div id="dialogue-text"></div>
        <div id="click-indicator">▼</div>
        
        <div id="options-container"></div>
        
        <div id="action-btn-container">
            <button id="action-btn" class="action-btn">下一步</button>
        </div>
    </div>
</div>

<script>
    const gameData = [
        {
            level: 1,
            sceneImageId: "IMG_01_SCENE_PANTRY",
            sceneZh: "辦公室茶水間。你和黎恩平時只是點頭之交的同事。",
            sceneEn: "Office pantry. You and Rien are just casual acquaintances at work.",
            dialogue: "You didn't eat lunch because you were too busy?",
            options: [
                { text: "I skipped lunch because I wanted you to bring me something!", result: "Fail", endingImageId: "IMG_01_END_FAIL_A", endingZh: "黎恩覺得你太有控制慾，默默拉開距離。", endingEn: "Rien feels you are too controlling and quietly distances himself." },
                { text: "I didn't eat lunch because I had a lot of work.", result: "Fail", endingImageId: "IMG_01_END_FAIL_B", endingZh: "黎恩只回了句「那辛苦了」，毫無火花。", endingEn: "Rien simply replies, 'That's tough,' with zero sparks." },
                { text: "I just grabbed a sandwich because I want to eat dinner with you.", result: "Pass", endingImageId: "IMG_01_END_PASS", endingZh: "黎恩愣了一下，隨後笑著答應了。成功開啟了你們的私下交集！", endingEn: "Rien pauses for a second, then smiles and agrees. You've successfully started interacting outside of work!" }
            ]
        },
        {
            level: 2,
            sceneImageId: "IMG_02_SCENE_NIGHT",
            sceneZh: "深夜的辦公室只剩你們兩人，剛忙完一個大專案。",
            sceneEn: "It's late at night, and you two are the only ones left in the office after finishing a major project.",
            dialogue: "There's no train now because it's too late. Do you want to grab some late-night snack (宵夜)?",
            options: [
                { text: "I want to go to your home because I want to see your room.", result: "Fail", endingImageId: "IMG_02_END_FAIL_A", endingZh: "黎恩覺得進展太快了，委婉地笑著說：「太晚了不太方便」，並幫你叫了一輛 Uber 塞你上車。", endingEn: "Rien thinks you're moving too fast, politely smiles, and puts you in an Uber." },
                { text: "I will just order delivery (外送) because I am too tired to go out.", result: "Fail", endingImageId: "IMG_02_END_FAIL_B", endingZh: "黎恩點點頭說：「那辛苦了，早點休息。」兩人各自叫了外送，沒有更多交流。", endingEn: "Rien nods and says, 'Rest well.' You both order delivery with no further interaction." },
                { text: "I will go with you because I want to chat with you longer.", result: "Pass", endingImageId: "IMG_02_END_PASS", endingZh: "黎恩輕笑了一聲：「那我知道一間不錯的店喔。」兩人一起走入夜色中。", endingEn: "Rien chuckles softly, 'I know a good place.' You both walk into the night." }
            ]
        },
        {
            level: 3,
            sceneImageId: "IMG_03_SCENE_RAIN",
            sceneZh: "下班遇到滂沱大雨，你們被迫靠得很近。",
            sceneEn: "You encounter heavy rain after work and are forced to stand very close to each other.",
            dialogue: "We need to share this small umbrella because it is raining heavily.",
            options: [
                { text: "I will hold you tightly because I don't want you to get wet.", result: "Fail", endingImageId: "IMG_03_END_FAIL_A", endingZh: "在大街上突然被緊抱，黎恩覺得你太過火了，不自在地推開你。", endingEn: "Suddenly hugged tightly on the street, Rien thinks you've crossed the line and pushes you away." },
                { text: "I will just run in the rain because the umbrella is too small.", result: "Fail", endingImageId: "IMG_03_END_FAIL_B", endingZh: "你淋成落湯雞，黎恩覺得你實在很不懂情調。", endingEn: "You get soaked, and Rien thinks you completely lack romance." },
                { text: "I don't mind the small umbrella because I like walking close to you.", result: "Pass", endingImageId: "IMG_03_END_PASS", endingZh: "雨聲中，黎恩的耳朵微微紅了。他默默把傘往你這邊傾斜了一點，兩人的肩膀輕輕摩擦著。", endingEn: "Amidst the rain, Rien's ears turn slightly red. He quietly tilts the umbrella towards you." }
            ]
        },
        {
            level: 4,
            sceneImageId: "IMG_04_SCENE_GYM",
            sceneZh: "逐漸熟絡後，話題開始圍繞著彼此的下班興趣。",
            sceneEn: "As you become more familiar, the conversation starts to revolve around each other's after-work hobbies.",
            dialogue: "I go to the gym after work every day because I want to stay fit.",
            options: [
                { text: "I will go with you because I just want to take selfies (自拍) there.", result: "Fail", endingImageId: "IMG_04_END_FAIL_A", endingZh: "黎恩覺得你對運動根本不認真，尷尬地笑笑說：「那健身房可能不適合你喔」。", endingEn: "Rien feels you are not serious about working out, laughs awkwardly, and says 'The gym might not be for you'." },
                { text: "I won't go because working out is too tiring.", result: "Fail", endingImageId: "IMG_04_END_FAIL_B", endingZh: "黎恩覺得你們的興趣不合，默默轉移話題。", endingEn: "Rien feels your interests are incompatible and quietly changes the subject." },
                { text: "I will join you because I need a handsome coach.", result: "Pass", endingImageId: "IMG_04_END_PASS", endingZh: "黎恩轉過頭去掩飾上揚的嘴角。他低聲說：「那你要做好心理準備，我很嚴格的喔。」", endingEn: "Rien turns away to hide a smirk. He whispers, 'You better be prepared; I'm strict.'" }
            ]
        },
        {
            level: 5,
            sceneImageId: "IMG_05_SCENE_TIE",
            sceneZh: "某次重要會議前，他在座位上顯得有些手忙腳亂，你們的距離近到能聽見彼此的呼吸。",
            sceneEn: "Before an important meeting, he looks a bit flustered. You are close enough to hear each other's breathing.",
            dialogue: "I need your help because I can't tie this tie properly today.",
            options: [
                { text: "I will tie it for you because you always look good in suits.", result: "Pass", endingImageId: "IMG_05_END_PASS", endingZh: "你靠近他幫他整理領帶，兩人不小心靠得很近。他垂下眼眸看著你專注的神情，耳根微微泛紅，似乎覺得有點熱。", endingEn: "You lean in to adjust his tie, getting accidentally close. He looks at your focused expression, and his ears turn slightly red, seemingly feeling warm." },
                { text: "I will hide it because I want to tease (捉弄) you.", result: "Fail", endingImageId: "IMG_05_END_FAIL_A", endingZh: "黎恩覺得你把重要的客戶會議當兒戲，皺起眉頭自己找新領帶。", endingEn: "Rien thinks you're treating the important meeting like a joke and frowns while looking for a new tie." },
                { text: "You should watch a video because I don't know how to do it either.", result: "Fail", endingImageId: "IMG_05_END_FAIL_B", endingZh: "黎恩默默拿出手機查教學，氣氛瞬間降溫。", endingEn: "Rien silently takes out his phone to look up a tutorial. The atmosphere freezes." }
            ]
        },
        {
            level: 6,
            sceneImageId: "IMG_06_SCENE_HOTEL",
            sceneZh: "員工研習抵達飯店，發現你們被分配到同一間雙人房（兩張單人床）。",
            sceneEn: "Arriving at the hotel for the staff training, you find the company booked a twin room (two single beds) for you to share.",
            dialogue: "We have to be roommates because the company wants to save money.",
            options: [
                { text: "We can play games all night because tomorrow is a holiday.", result: "Fail", endingImageId: "IMG_06_END_FAIL_A", endingZh: "黎恩覺得明天還要早起研習，皺起眉頭叫你早點睡覺。", endingEn: "Rien thinks about the early training tomorrow, frowns, and tells you to go to bed early." },
                { text: "I will sleep on the floor because I don't want to share a room.", result: "Fail", endingImageId: "IMG_06_END_FAIL_B", endingZh: "黎恩覺得你實在太見外了，兩人整晚氣氛僵硬，毫無進展。", endingEn: "Rien feels you are treating him like a stranger. The atmosphere is stiff all night." },
                { text: "I hope you don't mind because I am afraid of the dark and need a night light.", result: "Pass", endingImageId: "IMG_06_END_PASS", endingZh: "黎恩的眼神變得溫柔，他輕聲說：「沒關係，我會為你留一盞燈。」夜晚的房間裡充滿了安心的感覺。", endingEn: "Rien's eyes soften. He whispers, 'It's okay, I'll leave a light on for you.' The room is filled with a sense of security." }
            ]
        },
        {
            level: 7,
            sceneImageId: "IMG_07_SCENE_WINE",
            sceneZh: "專案順利結束的聚餐。因為餐廳裡的暖氣，他的臉頰微微泛紅。",
            sceneEn: "At the celebration dinner. His cheeks are slightly red from the heating in the restaurant.",
            dialogue: "My face is red because the room is too warm.",
            options: [
                { text: "I will turn off the air conditioner (冷氣) because I feel cold.", result: "Fail", endingImageId: "IMG_07_END_FAIL_A", endingZh: "黎恩熱得受不了，覺得你完全不顧他的感受，拿起外套決定去外面透氣。", endingEn: "Rien can't stand the heat, feels you don't care about him, and takes his jacket to get some fresh air outside." },
                { text: "You should drink some iced water because it helps you cool down.", result: "Fail", endingImageId: "IMG_07_END_FAIL_B", endingZh: "黎恩接過你的冰水，笑著說：「謝謝，你好體貼。」氣氛變成了溫馨的同事聚餐。", endingEn: "Rien takes the iced water and smiles, 'Thanks, you are so considerate.' The vibe turns into a cozy colleague dinner." },
                { text: "Your face is red because you are looking at me.", result: "Pass", endingImageId: "IMG_07_END_PASS", endingZh: "黎恩先是愣住，隨後徹底投降。他輕輕笑著低聲說：「...被你發現了。」", endingEn: "Rien freezes, then completely surrenders. He chuckles softly and whispers, '...You caught me.'" }
            ]
        }
    ];

    let currentLevelIndex = 0;
    let gameState = "scene_intro"; 

    const imagePlaceholder = document.getElementById("image-placeholder");
    const characterName = document.getElementById("character-name");
    const dialogueText = document.getElementById("dialogue-text");
    const clickIndicator = document.getElementById("click-indicator");
    const optionsContainer = document.getElementById("options-container");
    const uiContainer = document.getElementById("ui-container");
    const actionBtnContainer = document.getElementById("action-btn-container");
    const actionBtn = document.getElementById("action-btn");
    const imgContainer = document.getElementById("image-container");

    function loadLevel(index) {
        gameState = "scene_intro";
        const levelData = gameData[index];
        
        // CSS 已經寫好了 background-size 的 RWD 控制，所以這裡只需換圖片網址即可！
        imgContainer.style.backgroundImage = `url('./${levelData.sceneImageId}.png')`;
        
        characterName.innerText = "【 系統場景提示 】";
        dialogueText.innerHTML = `${levelData.sceneZh}<div class="english-text">${levelData.sceneEn}</div>`;
        
        optionsContainer.style.display = "none";
        actionBtnContainer.style.display = "none";
        clickIndicator.style.display = "block";
        uiContainer.style.cursor = "pointer";
    }

    function advanceState() {
        if (gameState === "scene_intro") {
            const levelData = gameData[currentLevelIndex];
            gameState = "question";
            
            characterName.innerText = "黎恩 (Rien)";
            dialogueText.innerHTML = levelData.dialogue; 
            clickIndicator.style.display = "none";
            uiContainer.style.cursor = "default";
            
            optionsContainer.innerHTML = "";
            levelData.options.forEach((opt) => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = opt.text;
                btn.onclick = (e) => {
                    e.stopPropagation(); 
                    selectOption(opt);
                };
                optionsContainer.appendChild(btn);
            });
            optionsContainer.style.display = "flex";
        }
    }

    function selectOption(option) {
        gameState = "ending";
        optionsContainer.style.display = "none"; 
        
        imgContainer.style.backgroundImage = `url('./${option.endingImageId}.png')`;
        
        characterName.innerText = (option.result === "Pass") ? "【 心動瞬間 】" : "【 氣氛凝結 】";
        dialogueText.innerHTML = `${option.endingZh}<div class="english-text">${option.endingEn}</div>`;

        actionBtnContainer.style.display = "block";
        
        // 移除先前的綁定，防止重複觸發
        actionBtn.onclick = null; 

        if (option.result === "Pass") {
            if (currentLevelIndex === gameData.length - 1) {
                // 第七關成功，進入隱藏勝利結局按鈕
                actionBtn.innerText = "進入最終結局 (True Ending)";
                actionBtn.className = "action-btn true-ending-btn";
                actionBtn.onclick = (e) => {
                    e.stopPropagation();
                    showTrueEnding();
                };
            } else {
                actionBtn.innerText = "進入下一關 (Next Level)";
                actionBtn.className = "action-btn pass";
                actionBtn.onclick = (e) => {
                    e.stopPropagation();
                    currentLevelIndex++;
                    loadLevel(currentLevelIndex);
                };
            }
        } else {
            actionBtn.innerText = "重新開始 (Restart)";
            actionBtn.className = "action-btn";
            actionBtn.onclick = (e) => {
                e.stopPropagation();
                currentLevelIndex = 0;
                loadLevel(currentLevelIndex);
            };
        }
    }

    // 觸發最終勝利畫面 (隱藏的第八個頁面)
    function showTrueEnding() {
        gameState = "true_ending";
        
        // 載入勝利結局圖 
        imgContainer.style.backgroundImage = `url('./IMG_08_TRUE_ENDING_KISS.png')`;
        
        characterName.innerText = "【 完美通關 True Ending 】";
        dialogueText.innerHTML = `恭喜你，成功捕獲黎恩的心！<div class="english-text">Congratulations, you've captured Rien's heart!</div>`;
        
        // 隱藏選項，只留重玩按鈕
        optionsContainer.style.display = "none";
        clickIndicator.style.display = "none";
        uiContainer.style.cursor = "default";
        
        actionBtnContainer.style.display = "block";
        actionBtn.innerText = "重新回味 (Play Again)";
        actionBtn.className = "action-btn pass";
        actionBtn.onclick = (e) => {
            e.stopPropagation();
            currentLevelIndex = 0; // 重置遊戲
            loadLevel(currentLevelIndex);
        };
    }

    // 遊戲初始化
    loadLevel(currentLevelIndex);
</script>

</body>
</html>
